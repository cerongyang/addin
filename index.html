<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Splitter Arcade</title>
    <!-- Office JavaScript API for Taskpane Compatibility -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/scripts/office.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            border: 2px solid #333;
            width: 100vw;
            height: 100vh;
            max-width: 800px;
            max-height: 600px;
        }
        canvas {
            background: #1a1a1a;
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10;
        }
        h1 {
            margin-bottom: 10px;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            font-size: 24px;
        }
        p {
            color: #aaa;
            margin-bottom: 20px;
            text-align: center;
            max-width: 400px;
            font-size: 13px;
            padding: 0 15px;
        }
        .btn {
            background: #00ffff;
            color: #111;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
        }
        .btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div id="score-display">Score: 0</div>
        <div id="lives-display">Lives: 3</div>
    </div>
    
    <div id="ui-overlay">
        <h1 id="menu-title">BALL SPLITTER</h1>
        <p id="menu-desc">Use <b>A/D</b> or <b>Arrow Keys</b> to move. Press <b>Space</b> to shoot lasers. Destroy balls, collect upgrades, and avoid getting hit!</p>
        <button class="btn" id="play-btn" onclick="startGame()">PLAY GAME</button>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
    let canvas, ctx;
    let gameState = "MENU";
    let score = 0;
    let lives = 3;
    let animationFrameId = null;

    const keys = {};
    window.addEventListener("keydown", e => { 
        keys[e.code] = true; 
        if(e.code === "Space" && gameState === "PLAYING") {
            e.preventDefault(); // Prevent page scrolling on spacebar
            shootLaser(); 
        }
    });
    window.addEventListener("keyup", e => { keys[e.code] = false; });

    let ship = { x: 400, y: 530, width: 40, height: 20, speed: 7, color: "#00ffff" };
    let bullets = [];
    let balls = [];
    let powerUps = [];
    let laserLevel = 1;

    // Stable arcade physics constants
    const gravity = 0.35;
    const ballConfigs = {
        3: { radius: 40, bounceVel: -11.5, color: "#ff3366", splitSize: 2, scoreVal: 100 },
        2: { radius: 25, bounceVel: -9.5, color: "#ff9933", splitSize: 1, scoreVal: 50 },
        1: { radius: 15, bounceVel: -7.5, color: "#ffff33", splitSize: 0, scoreVal: 25 }
    };

    // Initialize Office Add-in context safely
    Office.onReady((info) => {
        canvas = document.getElementById("gameCanvas");
        ctx = canvas.getContext("2d");
        console.log("Office Add-in ready. Game initialized.");
    });

    // Fallback standard browser init if Office.js isn't mandatory for local testing
    window.addEventListener("DOMContentLoaded", () => {
        if (!canvas) {
            canvas = document.getElementById("gameCanvas");
            ctx = canvas.getContext("2d");
        }
    });

    function startGame() {
        if (!canvas) {
            canvas = document.getElementById("gameCanvas");
            ctx = canvas.getContext("2d");
        }
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        
        gameState = "PLAYING";
        score = 0;
        lives = 3;
        laserLevel = 1;
        bullets = [];
        powerUps = [];
        ship.x = canvas.width / 2 - ship.width / 2;
        
        balls = [{
            x: canvas.width / 2,
            y: 120,
            vx: 3,
            vy: 0,
            size: 3
        }];

        document.getElementById("ui-overlay").style.display = "none";
        loop();
    }

    function gameOver() {
        gameState = "GAMEOVER";
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        document.getElementById("menu-title").innerText = "GAME OVER";
        document.getElementById("menu-desc").innerText = `Final Score: ${score}`;
        document.getElementById("play-btn").innerText = "PLAY AGAIN";
        document.getElementById("ui-overlay").style.display = "flex";
    }

    function shootLaser() {
        if (laserLevel === 1) {
            bullets.push({ x: ship.x + ship.width / 2 - 2, y: ship.y, width: 4, height: 14, speed: 12 });
        } else if (laserLevel === 2) {
            bullets.push({ x: ship.x + 6, y: ship.y, width: 4, height: 14, speed: 12 });
            bullets.push({ x: ship.x + ship.width - 10, y: ship.y, width: 4, height: 14, speed: 12 });
        } else {
            bullets.push({ x: ship.x + ship.width / 2 - 2, y: ship.y, width: 4, height: 14, speed: 12, vx: 0 });
            bullets.push({ x: ship.x + 2, y: ship.y, width: 4, height: 14, speed: 12, vx: -2.5 });
            bullets.push({ x: ship.x + ship.width - 6, y: ship.y, width: 4, height: 14, speed: 12, vx: 2.5 });
        }
    }

    function update() {
        if (gameState !== "PLAYING") return;

        if ((keys["ArrowLeft"] || keys["KeyA"]) && ship.x > 0) ship.x -= ship.speed;
        if ((keys["ArrowRight"] || keys["KeyD"]) && ship.x < canvas.width - ship.width) ship.x += ship.speed;

        // Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.y -= b.speed;
            if (b.vx) b.x += b.vx;
            if (b.y < 0) bullets.splice(i, 1);
        }

        // Balls Physics & Collision Loop
        for (let i = balls.length - 1; i >= 0; i--) {
            let ball = balls[i];
            let cfg = ballConfigs[ball.size];

            ball.vy += gravity;
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Wall Collisions
            if (ball.x - cfg.radius <= 0) {
                ball.x = cfg.radius;
                ball.vx = Math.abs(ball.vx);
            } else if (ball.x + cfg.radius >= canvas.width) {
                ball.x = canvas.width - cfg.radius;
                ball.vx = -Math.abs(ball.vx);
            }

            // Floor Collision
            if (ball.y + cfg.radius >= canvas.height) {
                ball.y = canvas.height - cfg.radius;
                ball.vy = cfg.bounceVel;
            }

            // Ship Collision
            let distX = (ship.x + ship.width / 2) - ball.x;
            let distY = (ship.y + ship.height / 2) - ball.y;
            let distance = Math.sqrt(distX * distX + distY * distY);

            if (distance < cfg.radius + ship.width / 3) {
                lives--;
                if (lives <= 0) {
                    gameOver();
                    return;
                } else {
                    ball.y = 100;
                    ball.vy = 0;
                    ship.x = canvas.width / 2 - ship.width / 2;
                    break;
                }
            }

            // Bullet Collision & Splitting
            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                let bDist = Math.hypot(b.x - ball.x, b.y - ball.y);
                if (bDist < cfg.radius) {
                    bullets.splice(j, 1);
                    score += cfg.scoreVal;

                    if (Math.random() < 0.25) {
                        powerUps.push({ x: ball.x, y: ball.y, size: 12, speed: 2.5 });
                    }

                    if (cfg.splitSize > 0) {
                        let nextCfg = ballConfigs[cfg.splitSize];
                        balls.push({ 
                            x: ball.x - 6, 
                            y: ball.y, 
                            vx: -3.5, 
                            vy: nextCfg.bounceVel * 0.8, 
                            size: cfg.splitSize 
                        });
                        balls.push({ 
                            x: ball.x + 6, 
                            y: ball.y, 
                            vx: 3.5, 
                            vy: nextCfg.bounceVel * 0.8, 
                            size: cfg.splitSize 
                        });
                    }
                    balls.splice(i, 1);
                    break;
                }
            }
        }

        // Power-ups
        for (let i = powerUps.length - 1; i >= 0; i--) {
            let p = powerUps[i];
            p.y += p.speed;

            if (p.x > ship.x && p.x < ship.x + ship.width && p.y > ship.y && p.y < ship.y + ship.height) {
                if (laserLevel < 3) laserLevel++;
                powerUps.splice(i, 1);
                score += 200;
                continue;
            }

            if (p.y > canvas.height) powerUps.splice(i, 1);
        }

        if (balls.length === 0) {
            balls.push({ x: canvas.width / 2, y: 120, vx: 3, vy: 0, size: 3 });
        }

        document.getElementById("score-display").innerText = `Score: ${score}`;
        document.getElementById("lives-display").innerText = `Lives: ${"❤️".repeat(lives)}`;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Ship
        ctx.fillStyle = ship.color;
        ctx.beginPath();
        ctx.moveTo(ship.x + ship.width / 2, ship.y);
        ctx.lineTo(ship.x, ship.y + ship.height);
        ctx.lineTo(ship.x + ship.width, ship.y + ship.height);
        ctx.closePath();
        ctx.fill();

        // Bullets
        ctx.fillStyle = "#00ffcc";
        for (let b of bullets) {
            ctx.fillRect(b.x, b.y, b.width, b.height);
        }

        // Balls
        for (let ball of balls) {
            let cfg = ballConfigs[ball.size];
            ctx.fillStyle = cfg.color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, cfg.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Power-ups
        for (let p of powerUps) {
            ctx.fillStyle = "#00ff00";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#111";
            ctx.font = "bold 12px sans-serif";
            ctx.fillText("UP", p.x - 9, p.y + 4);
        }
    }

    function loop() {
        if (gameState !== "PLAYING") return;
        update();
        draw();
        animationFrameId = requestAnimationFrame(loop);
    }
</script>

</body>
</html>
