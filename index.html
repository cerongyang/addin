<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: https:; img-src * data: https:; style-src * 'unsafe-inline';">
    <title>Neon Ball Splitter - Office Add-in</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/scripts/office.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            background: #020205;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 320px;
            background: #07070c;
            border-left: 2px solid #00ffff;
            border-right: 2px solid #00ffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3), inset 0 0 15px rgba(0, 255, 255, 0.1);
        }
        canvas {
            display: block;
            width: 100%;
            flex-grow: 1;
            background: #07070c;
            outline: none;
            cursor: crosshair;
        }
        #controls-bar {
            width: 100%;
            height: 55px;
            background: #0d0d16;
            border-top: 2px solid #00ffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 5px;
            flex-shrink: 0;
            z-index: 20;
            box-shadow: 0 -5px 15px rgba(0, 255, 255, 0.15);
        }
        .ctrl-btn {
            background: rgba(0, 255, 255, 0.15);
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            user-select: none;
            flex: 1;
            margin: 0 3px;
            text-align: center;
            touch-action: manipulation;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4), inset 0 0 5px rgba(0, 255, 255, 0.2);
        }
        .ctrl-btn:active {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 20px #00ffff, inset 0 0 10px #00ffff;
        }
        #hud {
            position: absolute;
            top: 6px;
            left: 8px;
            right: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            font-weight: bold;
            z-index: 5;
            pointer-events: none;
            color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
        }
    </style>
</head>
<body onload="startGame()">
<div id="game-container">
    <div id="hud">
        <div id="score">SCORE: 0</div>
        <div id="level-display">LVL: 1</div>
        <div id="upgrade-status">PWR: NONE</div>
        <div id="lives">LIVES: ❤️❤️❤️</div>
    </div>
    
    <canvas id="canvas" width="320" height="420" tabindex="1"></canvas>

    <div id="controls-bar">
        <div class="ctrl-btn" id="btn-left">◀ LEFT</div>
        <div class="ctrl-btn" id="btn-shoot">FIRE 🚀</div>
        <div class="ctrl-btn" id="btn-right">RIGHT ▶</div>
    </div>
</div>

<script>
    let canvas, ctx;
    const WIDTH = 320;
    const HEIGHT = 420;

    let gameState = "PLAYING";
    let score = 0;
    let lives = 3;
    let currentLevel = 1;
    let animId = null;

    let ship = { x: WIDTH / 2 - 16, y: HEIGHT - 35, w: 32, h: 16, speed: 5.5 };
    let bullets = [];
    let balls = [];
    let particles = [];
    let powerUps = [];
    let keys = {};
    
    let activePowerUp = null;
    let powerUpTimer = 0;

    function ensureFocus() {
        if (canvas) canvas.focus();
    }

    function initApp() {
        canvas = document.getElementById("canvas");
        if (!canvas) return;
        ctx = canvas.getContext("2d");
        ensureFocus();

        const setupBtn = (id, actionDown, actionUp) => {
            let el = document.getElementById(id);
            if (!el) return;
            el.addEventListener("pointerdown", (e) => { 
                e.preventDefault(); 
                ensureFocus();
                actionDown(); 
            });
            el.addEventListener("pointerup", (e) => { e.preventDefault(); actionUp(); });
            el.addEventListener("pointerleave", (e) => { e.preventDefault(); actionUp(); });
        };

        setupBtn("btn-left", () => { keys["ArrowLeft"] = true; }, () => { keys["ArrowLeft"] = false; });
        setupBtn("btn-right", () => { keys["ArrowRight"] = true; }, () => { keys["ArrowRight"] = false; });
        setupBtn("btn-shoot", () => { if (gameState === "PLAYING") shoot(); }, () => {});
        
        canvas.addEventListener("click", () => ensureFocus());
    }

    if (typeof Office !== 'undefined' && Office.onReady) {
        Office.onReady(() => { initApp(); startGame(); });
    }
    window.addEventListener("DOMContentLoaded", () => { initApp(); startGame(); });

    window.addEventListener("keydown", e => {
        if (["ArrowLeft", "ArrowRight", "Space", "KeyA", "KeyD"].includes(e.code)) {
            e.preventDefault();
        }
        keys[e.code] = true;

        if (e.code === "Enter" && gameState !== "PLAYING") {
            e.preventDefault();
            startGame();
        }
        if (e.code === "Space" && gameState === "PLAYING") {
            shoot();
        }
    });

    window.addEventListener("keyup", e => {
        keys[e.code] = false;
    });

    function startGame() {
        if (!canvas) initApp();
        if (animId) cancelAnimationFrame(animId);

        gameState = "PLAYING";
        score = 0;
        lives = 3;
        currentLevel = 1;
        bullets = [];
        particles = [];
        powerUps = [];
        activePowerUp = null;
        powerUpTimer = 0;
        ship.x = WIDTH / 2 - ship.w / 2;

        loadLevel(currentLevel);
        ensureFocus();
        loop();
    }

    function loadLevel(lvl) {
        balls = [];
        // Scales up to tier 7 boss balls on higher levels
        let startingSize = Math.min(7, 1 + Math.floor((lvl - 1) / 2));
        let count = lvl > 5 ? 2 : 1;

        for (let i = 0; i < count; i++) {
            balls.push({ 
                x: WIDTH / 2 + (i === 0 ? 0 : (i % 2 === 0 ? 50 : -50)), 
                y: 60 + i * 20, 
                vx: (i % 2 === 0 ? 1 : -1) * (1.8 + lvl * 0.07), 
                vy: 0, 
                size: startingSize 
            });
        }
    }

    function gameOver() {
        gameState = "GAMEOVER";
        if (animId) cancelAnimationFrame(animId);
        setTimeout(() => {
            startGame();
        }, 2000);
    }

    function shoot() {
        if (activePowerUp === "TRIPLE") {
            bullets.push({ x: ship.x + ship.w / 2 - 2, y: ship.y, w: 4, h: 10, spd: 11, vx: 0, isPlayer: true });
            bullets.push({ x: ship.x + ship.w / 2 - 2, y: ship.y, w: 4, h: 10, spd: 11, vx: -1.5, isPlayer: true });
            bullets.push({ x: ship.x + ship.w / 2 - 2, y: ship.y, w: 4, h: 10, spd: 11, vx: 1.5, isPlayer: true });
        } else {
            bullets.push({ x: ship.x + ship.w / 2 - 2, y: ship.y, w: 4, h: 10, spd: 10, vx: 0, isPlayer: true });
        }
    }

    function spawnExplosion(x, y, color) {
        for (let i = 0; i < 18; i++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 6 + 1;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                alpha: 1,
                color: color,
                size: Math.random() * 4 + 1
            });
        }
    }

    function releaseBallBullets(x, y) {
        for (let i = 0; i < 8; i++) {
            let angle = (i * Math.PI * 2) / 8;
            let speed = 5.0;
            bullets.push({
                x: x,
                y: y,
                w: 4,
                h: 8,
                spd: Math.cos(angle) * speed,
                vx: Math.sin(angle) * speed,
                isPlayer: false
            });
        }
    }

    function spawnPowerUp(x, y) {
        if (Math.random() < 0.45) {
            let types = ["TRIPLE", "SHIELD", "SPEED"];
            let type = types[Math.floor(Math.random() * types.length)];
            let color = type === "TRIPLE" ? "#ff00ff" : (type === "SHIELD" ? "#00ff66" : "#00ccff");
            powerUps.push({ x: x, y: y, vy: 1.5, type: type, color: color, size: 11 });
        }
    }

    const gravity = 0.4;
    const ballConfigs = {
        7: { radius: 46, targetHeight: 390, color: "#ff00aa", glow: "#ff66cc", splitSize: 6, points: 2000 },
        6: { radius: 41, targetHeight: 360, color: "#7000ff", glow: "#aa66ff", splitSize: 5, points: 1000 },
        5: { radius: 36, targetHeight: 340, color: "#9900ff", glow: "#cc44ff", splitSize: 4, points: 500 },
        4: { radius: 31, targetHeight: 310, color: "#00eeff", glow: "#77ffff", splitSize: 3, points: 250 },
        3: { radius: 26, targetHeight: 280, color: "#ff1144", glow: "#ff3366", splitSize: 2, points: 100 },
        2: { radius: 18, targetHeight: 200, color: "#ff8800", glow: "#ffaa33", splitSize: 1, points: 50 },
        1: { radius: 11, targetHeight: 130, color: "#ffee00", glow: "#ffff55", splitSize: 0, points: 25 }
    };

    function update() {
        if (gameState !== "PLAYING") return;

        let currentSpeed = ship.speed * (activePowerUp === "SPEED" ? 1.4 : 1.0);
        if ((keys["ArrowLeft"] || keys["KeyA"]) && ship.x > 0) ship.x -= currentSpeed;
        if ((keys["ArrowRight"] || keys["KeyD"]) && ship.x < WIDTH - ship.w) ship.x += currentSpeed;

        if (powerUpTimer > 0) {
            powerUpTimer--;
            if (powerUpTimer <= 0) activePowerUp = null;
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            if (b.isPlayer) {
                b.y -= b.spd;
                if (b.vx) b.x += b.vx;
            } else {
                b.y += b.spd;
                b.x += b.vx;
            }
            if (b.y < 0 || b.y > HEIGHT || b.x < 0 || b.x > WIDTH) {
                bullets.splice(i, 1);
            }
        }

        for (let i = powerUps.length - 1; i >= 0; i--) {
            let p = powerUps[i];
            p.y += p.vy;
            let dx = (ship.x + ship.w / 2) - p.x;
            let dy = (ship.y + ship.h / 2) - p.y;
            if (Math.hypot(dx, dy) < ship.w / 2 + p.size) {
                activePowerUp = p.type;
                powerUpTimer = 450;
                if (p.type === "SHIELD") lives = Math.min(lives + 1, 5);
                powerUps.splice(i, 1);
            } else if (p.y > HEIGHT) {
                powerUps.splice(i, 1);
            }
        }

        for (let i = balls.length - 1; i >= 0; i--) {
            let ball = balls[i];
            let cfg = ballConfigs[ball.size];

            ball.vy += gravity;
            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.x - cfg.radius <= 0) {
                ball.x = cfg.radius;
                ball.vx = Math.abs(ball.vx);
            } else if (ball.x + cfg.radius >= WIDTH) {
                ball.x = WIDTH - cfg.radius;
                ball.vx = -Math.abs(ball.vx);
            }

            if (ball.y + cfg.radius >= HEIGHT) {
                ball.y = HEIGHT - cfg.radius;
                ball.vy = -Math.sqrt(2 * gravity * cfg.targetHeight);
            }

            let dx = (ship.x + ship.w / 2) - ball.x;
            let dy = (ship.y + ship.h / 2) - ball.y;
            if (Math.hypot(dx, dy) < cfg.radius + ship.w / 3) {
                if (activePowerUp === "SHIELD") {
                    activePowerUp = null;
                    spawnExplosion(ship.x + ship.w/2, ship.y + ship.h/2, "#00ff66");
                    ball.y = 80;
                    ball.vy = 0;
                } else {
                    lives--;
                    spawnExplosion(ship.x + ship.w/2, ship.y + ship.h/2, "#00ffff");
                    if (lives <= 0) {
                        gameOver();
                        return;
                    } else {
                        ball.y = 80;
                        ball.vy = 0;
                        ship.x = WIDTH / 2 - ship.w / 2;
                        break;
                    }
                }
            }

            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                if (b.isPlayer && Math.hypot(b.x - ball.x, b.y - ball.y) < cfg.radius) {
                    bullets.splice(j, 1);
                    score += cfg.points;
                    spawnExplosion(ball.x, ball.y, cfg.color);
                    releaseBallBullets(ball.x, ball.y);
                    spawnPowerUp(ball.x, ball.y);

                    if (cfg.splitSize > 0) {
                        let splitBounce = -Math.sqrt(2 * gravity * (cfg.targetHeight * 0.75));
                        let speedMultiplier = 1.0 + (currentLevel * 0.05);
                        balls.push({ x: ball.x - 4, y: ball.y, vx: -2.2 * speedMultiplier, vy: splitBounce, size: cfg.splitSize });
                        balls.push({ x: ball.x + 4, y: ball.y, vx: 2.2 * speedMultiplier, vy: splitBounce, size: cfg.splitSize });
                    }
                    balls.splice(i, 1);
                    break;
                }
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.035;
            if (p.alpha <= 0) particles.splice(i, 1);
        }

        if (balls.length === 0) {
            currentLevel++;
            score += 1000 * currentLevel;
            loadLevel(currentLevel);
        }

        document.getElementById("score").innerText = `SCORE: ${score}`;
        document.getElementById("level-display").innerText = `LVL: ${currentLevel}`;
        document.getElementById("upgrade-status").innerText = `PWR: ${activePowerUp || 'NONE'}`;
        document.getElementById("lives").innerText = `LIVES: ${"❤️".repeat(lives)}`;
    }

    function draw() {
        ctx.fillStyle = "#07070c";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.strokeStyle = "rgba(0, 255, 255, 0.04)";
        ctx.lineWidth = 1;
        for (let x = 0; x < WIDTH; x += 20) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, HEIGHT); ctx.stroke();
        }
        for (let y = 0; y < HEIGHT; y += 20) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WIDTH, y); ctx.stroke();
        }

        for (let p of particles) {
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 12;
            ctx.shadowColor = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        for (let p of powerUps) {
            ctx.save();
            ctx.shadowBlur = 16;
            ctx.shadowColor = p.color;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = "#000";
            ctx.font = "bold 9px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(p.type[0], p.x, p.y);
            ctx.restore();
        }

        ctx.save();
        let shipColor = activePowerUp === "SHIELD" ? "#00ff66" : "#00ffff";
        ctx.shadowBlur = 22;
        ctx.shadowColor = shipColor;
        ctx.fillStyle = shipColor;
        ctx.beginPath();
        ctx.moveTo(ship.x + ship.w / 2, ship.y);
        ctx.lineTo(ship.x, ship.y + ship.h);
        ctx.lineTo(ship.x + ship.w, ship.y + ship.h);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.moveTo(ship.x + ship.w / 2, ship.y + 3);
        ctx.lineTo(ship.x + ship.w / 2 - 3, ship.y + ship.h - 3);
        ctx.lineTo(ship.x + ship.w / 2 + 3, ship.y + ship.h - 3);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.shadowBlur = 14;
        ctx.shadowColor = "#00ffcc";
        ctx.fillStyle = "#00ffcc";
        for (let b of bullets) {
            ctx.fillRect(b.x, b.y, b.w, b.h);
        }
        ctx.restore();

        for (let ball of balls) {
            let cfg = ballConfigs[ball.size];
            ctx.save();
            ctx.shadowBlur = 32;
            ctx.shadowColor = cfg.glow;
            
            ctx.fillStyle = cfg.color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, cfg.radius, 0, Math.PI * 2);
            ctx.fill();

            let gradient = ctx.createRadialGradient(ball.x - 4, ball.y - 4, 3, ball.x, ball.y, cfg.radius);
            gradient.addColorStop(0, "#ffffff");
            gradient.addColorStop(0.35, cfg.glow);
            gradient.addColorStop(1, cfg.color);
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, cfg.radius - 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = "#07070c";
            ctx.font = `900 ${Math.floor(cfg.radius * 0.7)}px sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(ball.size, ball.x, ball.y);
            ctx.restore();
        }
    }

    function loop() {
        if (gameState !== "PLAYING") return;
        update();
        draw();
        animId = requestAnimationFrame(loop);
    }
</script>
</body>
</html>
