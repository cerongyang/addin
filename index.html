<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ball Splitter Minimal</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; font-family: sans-serif; }
        canvas { background: #111; border: 2px solid #0ff; display: block; }
        #ui { position: absolute; text-align: center; }
        button { background: #0ff; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="ui">
    <h1>BALL SPLITTER</h1>
    <p>Arrow Keys/A-D to Move | Space to Shoot</p>
    <button onclick="startGame()">PLAY</button>
</div>

<canvas id="canvas" width="480" height="600"></canvas>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let playing = false;
    let ship = { x: 220, y: 550, w: 40, h: 20, speed: 6 };
    let bullets = [];
    let ball = { x: 240, y: 100, vx: 2, vy: 0, r: 30 };
    let keys = {};

    window.addEventListener("keydown", e => {
        keys[e.code] = true;
        if (e.code === "Space" && playing) {
            e.preventDefault();
            bullets.push({ x: ship.x + 18, y: ship.y, w: 4, h: 10 });
        }
    });
    window.addEventListener("keyup", e => { keys[e.code] = false; });

    function startGame() {
        playing = true;
        document.getElementById("ui").style.display = "none";
        loop();
    }

    function loop() {
        if (!playing) return;

        // 1. Controls
        if ((keys["ArrowLeft"] || keys["KeyA"]) && ship.x > 0) ship.x -= ship.speed;
        if ((keys["ArrowRight"] || keys["KeyD"]) && ship.x < 440) ship.x += ship.speed;

        // 2. Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].y -= 10;
            if (bullets[i].y < 0) bullets.splice(i, 1);
        }

        // 3. Ball Physics (Foolproof Bounce)
        ball.vy += 0.35; // Gravity
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Wall bounce (Left/Right)
        if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; }
        if (ball.x + ball.r > 480) { ball.x = 480 - ball.r; ball.vx *= -1; }

        // Floor bounce (Bottom) - Explicitly locks position to floor and forces upward velocity
        if (ball.y + ball.r > 600) {
            ball.y = 600 - ball.r;
            ball.vy = -11; 
        }

        // Bullet collision check
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            let dist = Math.hypot(b.x - ball.x, b.y - ball.y);
            if (dist < ball.r) {
                bullets.splice(i, 1);
                // Reset or split ball
                ball.y = 100;
                ball.vy = -5;
            }
        }

        // 4. Render
        ctx.clearRect(0, 0, 480, 600);

        // Ship
        ctx.fillStyle = "#0ff";
        ctx.fillRect(ship.x, ship.y, ship.w, ship.h);

        // Bullets
        ctx.fillStyle = "#0f0";
        for (let b of bullets) ctx.fillRect(b.x, b.y, b.w, b.h);

        // Ball
        ctx.fillStyle = "#f33";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();

        requestAnimationFrame(loop);
    }
</script>

</body>
</html>
