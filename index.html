<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: https:; img-src * data: https:; style-src * 'unsafe-inline';">
    <title>Neon Ball Splitter - Word Add-in</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/scripts/office.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #050508;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 400px;
            background: #0b0b12;
            border-left: 2px solid #00ffff;
            border-right: 2px solid #00ffff;
            box-shadow: 0 0 15px rgba(0,255,255,0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        canvas {
            display: block;
            width: 100%;
            flex-grow: 1;
            background: #0b0b12;
        }
        /* Responsive control bar optimized for Word taskpanes */
        #controls-bar {
            width: 100%;
            height: 65px;
            background: #11111a;
            border-top: 2px solid #00ffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 8px;
            flex-shrink: 0;
        }
        .ctrl-btn {
            background: rgba(0, 255, 255, 0.2);
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            user-select: none;
            flex: 1;
            margin: 0 4px;
            text-align: center;
            touch-action: manipulation;
        }
        .ctrl-btn:active {
            background: #00ffff;
            color: #000;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 15px;
            text-align: center;
            cursor: pointer;
        }
        h1 {
            color: #00ffff;
            margin: 0 0 8px 0;
            font-size: 22px;
            text-shadow: 0 0 10px rgba(0,255,255,0.7);
            letter-spacing: 1px;
        }
        p {
            color: #aaa;
            font-size: 11px;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .btn {
            background: linear-gradient(135deg, #00ffff, #0088ff);
            color: #000;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,255,255,0.5);
            transition: 0.2s;
            pointer-events: auto;
        }
        .btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
            transform: scale(1.03);
        }
        #hud {
            position: absolute;
            top: 8px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            color: #00ffff;
        }
    </style>
</head>
<body>
<div id="game-container">
    <div id="hud">
        <div id="score">SCORE: 0</div>
        <div id="level-display">LVL: 1</div>
        <div id="lives">LIVES: ❤️❤️❤️</div>
    </div>
    
    <div id="ui" onclick="startGame()">
        <h1 id="title">NEON SPLITTER</h1>
        <p>Use screen buttons or <b>A/D / Arrows</b> to move.<br>Press <b>Spacebar</b> to fire lasers.<br>Click or press <b>Enter</b> to start!</p>
        <button class="btn" id="start-btn">PLAY GAME</button>
    </div>
    
    <canvas id="canvas" width="400" height="520"></canvas>

    <!-- On-screen controls tailored for Office taskpane -->
    <div id="controls-bar">
        <div class="ctrl-btn" id="btn-left">◀ LEFT</div>
        <div class="ctrl-btn" id="btn-shoot">FIRE 🚀</div>
        <div class="ctrl-btn" id="btn-right">RIGHT ▶</div>
    </div>
</div>

<script>
    let canvas, ctx;
    const WIDTH = 400;
    const HEIGHT = 520;

    let gameState = "MENU";
    let score = 0;
    let lives = 3;
    let currentLevel = 1;
    let animId = null;

    let ship = { x: WIDTH / 2 - 18, y: HEIGHT - 40, w: 36, h: 20, speed: 6.5 };
    let bullets = [];
    let balls = [];
    let powerUps = [];
    let particles = [];
    let stars = [];
    let laserLvl = 1;
    let keys = {};

    function initApp() {
        canvas = document.getElementById("canvas");
        if (!canvas) return;
        ctx = canvas.getContext("2d");

        if (stars.length === 0) {
            for (let i = 0; i < 40; i++) {
                stars.push({
                    x: Math.random() * WIDTH,
                    y: Math.random() * HEIGHT,
                    size: Math.random() * 2,
                    speed: Math.random() * 0.5 + 0.2
                });
            }
        }

        const setupBtn = (id, actionDown, actionUp) => {
            let el = document.getElementById(id);
            if (!el) return;
            el.addEventListener("pointerdown", (e) => { e.preventDefault(); actionDown(); });
            el.addEventListener("pointerup", (e) => { e.preventDefault(); actionUp(); });
            el.addEventListener("pointerleave", (e) => { e.preventDefault(); actionUp(); });
        };

        setupBtn("btn-left", () => { keys["ArrowLeft"] = true; }, () => { keys["ArrowLeft"] = false; });
        setupBtn("btn-right", () => { keys["ArrowRight"] = true; }, () => { keys["ArrowRight"] = false; });
        setupBtn("btn-shoot", () => { if (gameState === "PLAYING") shoot(); }, () => {});
    }

    if (typeof Office !== 'undefined' && Office.onReady) {
        Office.onReady(() => { initApp(); });
    }
    window.addEventListener("DOMContentLoaded", () => { initApp(); });

    window.addEventListener("keydown", e => {
        if (["ArrowLeft", "ArrowRight", "Space", "KeyA", "KeyD"].includes(e.code)) {
            e.preventDefault();
        }
        keys[e.code] = true;

        if (e.code === "Enter" && gameState !== "PLAYING") {
            e.preventDefault();
            startGame();
        }
        if (e.code === "Space" && gameState === "PLAYING") {
            shoot();
        }
    });

    window.addEventListener("keyup", e => {
        keys[e.code] = false;
    });

    function startGame() {
        if (!canvas) initApp();
        if (animId) cancelAnimationFrame(animId);

        gameState = "PLAYING";
        score = 0;
        lives = 3;
        currentLevel = 1;
        laserLvl = 1;
        bullets = [];
        powerUps = [];
        particles = [];
        ship.x = WIDTH / 2 - ship.w / 2;

        loadLevel(currentLevel);

        document.getElementById("ui").style.display = "none";
        window.focus();
        loop();
    }

    function loadLevel(lvl) {
        balls = [];
        let ballCount = Math.min(lvl, 2);
        for (let i = 0; i < ballCount; i++) {
            let startX = WIDTH * (0.3 + (0.4 * i));
            if (ballCount === 1) startX = WIDTH / 2;
            
            balls.push({
                x: startX,
                y: 90 + (i * 20),
                vx: (i % 2 === 0 ? 2.5 : -2.5),
                vy: 0,
                size: 3
            });
        }
    }

    function gameOver() {
        gameState = "GAMEOVER";
        if (animId) cancelAnimationFrame(animId);
        document.getElementById("title").innerText = "GAME OVER";
        document.getElementById("start-btn").innerText = "PLAY AGAIN";
        document.getElementById("ui").style.display = "flex";
    }

    function shoot() {
        if (laserLvl === 1) {
            bullets.push({ x: ship.x + ship.w / 2 - 2, y: ship.y, w: 4, h: 12, spd: 12, vx: 0 });
        } else {
            bullets.push({ x: ship.x + 3, y: ship.y, w: 4, h: 12, spd: 12, vx: -1.5 });
            bullets.push({ x: ship.x + ship.w - 7, y: ship.y, w: 4, h: 12, spd: 12, vx: 1.5 });
        }
    }

    function spawnExplosion(x, y, color) {
        for (let i = 0; i < 12; i++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 3.5 + 1;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                alpha: 1,
                color: color,
                size: Math.random() * 2.5 + 1
            });
        }
    }

    const gravity = 0.42;
    const ballConfigs = {
        3: { radius: 32, targetHeight: 340, color: "#ff2255", glow: "#ff7799", splitSize: 2, points: 100 },
        2: { radius: 21, targetHeight: 240, color: "#ff8800", glow: "#ffbb55", splitSize: 1, points: 50 },
        1: { radius: 13, targetHeight: 150, color: "#ffee00", glow: "#ffff88", splitSize: 0, points: 25 }
    };

    function update() {
        if (gameState !== "PLAYING") return;

        for (let s of stars) {
            s.y += s.speed;
            if (s.y > HEIGHT) s.y = 0;
        }

        if ((keys["ArrowLeft"] || keys["KeyA"]) && ship.x > 0) ship.x -= ship.speed;
        if ((keys["ArrowRight"] || keys["KeyD"]) && ship.x < WIDTH - ship.w) ship.x += ship.speed;

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.y -= b.spd;
            if (b.vx) b.x += b.vx;
            if (b.y < 0) bullets.splice(i, 1);
        }

        for (let i = balls.length - 1; i >= 0; i--) {
            let ball = balls[i];
            let cfg = ballConfigs[ball.size];

            ball.vy += gravity;
            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.x - cfg.radius <= 0) {
                ball.x = cfg.radius;
                ball.vx = Math.abs(ball.vx);
            } else if (ball.x + cfg.radius >= WIDTH) {
                ball.x = WIDTH - cfg.radius;
                ball.vx = -Math.abs(ball.vx);
            }

            if (ball.y + cfg.radius >= HEIGHT) {
                ball.y = HEIGHT - cfg.radius;
                ball.vy = -Math.sqrt(2 * gravity * cfg.targetHeight);
            }

            let dx = (ship.x + ship.w / 2) - ball.x;
            let dy = (ship.y + ship.h / 2) - ball.y;
            if (Math.hypot(dx, dy) < cfg.radius + ship.w / 3) {
                lives--;
                spawnExplosion(ship.x + ship.w/2, ship.y + ship.h/2, "#00ffff");
                if (lives <= 0) {
                    gameOver();
                    return;
                } else {
                    ball.y = 90;
                    ball.vy = 0;
                    ship.x = WIDTH / 2 - ship.w / 2;
                    break;
                }
            }

            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                if (Math.hypot(b.x - ball.x, b.y - ball.y) < cfg.radius) {
                    bullets.splice(j, 1);
                    score += cfg.points;
                    spawnExplosion(ball.x, ball.y, cfg.color);

                    if (Math.random() < 0.25) {
                        powerUps.push({ x: ball.x, y: ball.y, r: 10, spd: 2 });
                    }

                    if (cfg.splitSize > 0) {
                        let nextCfg = ballConfigs[cfg.splitSize];
                        let splitBounce = -Math.sqrt(2 * gravity * (cfg.targetHeight * 0.75));
                        balls.push({ x: ball.x - 5, y: ball.y, vx: -2.8, vy: splitBounce, size: cfg.splitSize });
                        balls.push({ x: ball.x + 5, y: ball.y, vx: 2.8, vy: splitBounce, size: cfg.splitSize });
                    }
                    balls.splice(i, 1);
                    break;
                }
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.035;
            if (p.alpha <= 0) particles.splice(i, 1);
        }

        for (let i = powerUps.length - 1; i >= 0; i--) {
            let p = powerUps[i];
            p.y += p.spd;
            if (p.x > ship.x && p.x < ship.x + ship.w && p.y > ship.y && p.y < ship.y + ship.h) {
                if (laserLvl < 2) laserLvl++;
                powerUps.splice(i, 1);
                score += 150;
                continue;
            }
            if (p.y > HEIGHT) powerUps.splice(i, 1);
        }

        if (balls.length === 0) {
            currentLevel++;
            score += 400 * currentLevel;
            loadLevel(currentLevel);
        }

        document.getElementById("score").innerText = `SCORE: ${score}`;
        document.getElementById("level-display").innerText = `LVL: ${currentLevel}`;
        document.getElementById("lives").innerText = `LIVES: ${"❤️".repeat(lives)}`;
    }

    function draw() {
        ctx.fillStyle = "#0b0b12";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = "#ffffff";
        for (let s of stars) {
            ctx.globalAlpha = Math.random() * 0.5 + 0.3;
            ctx.fillRect(s.x, s.y, s.size, s.size);
        }
        ctx.globalAlpha = 1.0;

        for (let p of particles) {
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#00ffff";
        ctx.fillStyle = "#00ffff";
        ctx.beginPath();
        ctx.moveTo(ship.x + ship.w / 2, ship.y);
        ctx.lineTo(ship.x, ship.y + ship.h);
        ctx.lineTo(ship.x + ship.w, ship.y + ship.h);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#ff5500";
        ctx.fillRect(ship.x + ship.w / 2 - 3, ship.y + ship.h, 6, Math.random() * 6 + 3);
        ctx.restore();

        ctx.save();
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#00ffcc";
        ctx.fillStyle = "#00ffcc";
        for (let b of bullets) {
            ctx.fillRect(b.x, b.y, b.w, b.h);
        }
        ctx.restore();

        for (let ball of balls) {
            let cfg = ballConfigs[ball.size];
            ctx.save();
            ctx.shadowBlur = 14;
            ctx.shadowColor = cfg.glow;

            let grad = ctx.createRadialGradient(ball.x - cfg.radius/3, ball.y - cfg.radius/3, cfg.radius/8, ball.x, ball.y, cfg.radius);
            grad.addColorStop(0, cfg.glow);
            grad.addColorStop(0.7, cfg.color);
            grad.addColorStop(1, "#110011");

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, cfg.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.font = `bold ${Math.floor(cfg.radius * 0.85)}px sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowBlur = 4;
            ctx.shadowColor = "#000";
            ctx.fillText(ball.size, ball.x, ball.y);
            ctx.restore();
        }

        for (let p of powerUps) {
            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00ff00";
            ctx.fillStyle = "#00ff00";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#000";
            ctx.font = "bold 9px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("UP", p.x, p.y);
            ctx.restore();
        }
    }

    function loop() {
        if (gameState !== "PLAYING") return;
        update();
        draw();
        animId = requestAnimationFrame(loop);
    }
</script>
</body>
</html>
